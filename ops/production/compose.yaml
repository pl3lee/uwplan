name: uwplan-production
services:
  app:
    image: ${UWPLAN_IMAGE:?immutable image required}
    init: true
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 768m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - path: /etc/uwplan-production/app.env
        format: raw
    environment:
      RELEASE_DIGEST: ${RELEASE_DIGEST:?digest required}
      RELEASE_REVISION: ${RELEASE_REVISION:?revision required}
    ports: ["127.0.0.1:5002:5000"]
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  db:
    image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    restart: unless-stopped
    mem_limit: 160m
    memswap_limit: 512m
    shm_size: 64m
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=30, -c, work_mem=2MB, -c, maintenance_work_mem=16MB]
    environment:
      POSTGRES_DB: uwplan
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets: [postgres_admin_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d uwplan]
      interval: 5s
      timeout: 3s
      retries: 30
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  migrator:
    image: ${UWPLAN_IMAGE:?immutable image required}
    profiles: [migration]
    init: true
    restart: "no"
    mem_limit: 192m
    memswap_limit: 512m
    env_file:
      - path: /etc/uwplan-production/migrator.env
        format: raw
    environment:
      RELEASE_DIGEST: ${RELEASE_DIGEST:?digest required}
      RELEASE_REVISION: ${RELEASE_REVISION:?revision required}
    command: [node, /app/ops/deploy/migrate-release.mjs]
secrets:
  postgres_admin_password:
    file: /etc/uwplan-production/postgres-admin-password
volumes:
  postgres_data:
