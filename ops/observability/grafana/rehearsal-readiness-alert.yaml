apiVersion: 1

contactPoints:
  - orgId: 1
    name: UWPlan rehearsal Discord
    receivers:
      - uid: uwplan-discord-rehearsal
        type: discord
        settings:
          use_discord_username: true
          url: ${UWPLAN_DISCORD_WEBHOOK_URL}
        disableResolveMessage: false

groups:
  - orgId: 1
    name: uwplan-rehearsal
    folder: UWPlan
    interval: 30s
    rules:
      - uid: uwplan-rehearsal-readiness
        title: UWPlan rehearsal readiness
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 180
              to: 0
            datasourceUid: ${UWPLAN_PROMETHEUS_DATASOURCE_UID}
            model:
              datasource:
                type: prometheus
                uid: ${UWPLAN_PROMETHEUS_DATASOURCE_UID}
              editorMode: code
              expr: 'probe_success{instance="https://v2.uwplan.com/api/ready"}'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 0s
        annotations:
          summary: UWPlan rehearsal readiness is unavailable
          description: The external HTTPS readiness probe has failed.
        labels:
          service: uwplan
          environment: rehearsal
          severity: critical
        isPaused: false
        notification_settings:
          receiver: UWPlan rehearsal Discord
          group_wait: 5s
          group_interval: 10s
          repeat_interval: 4h
