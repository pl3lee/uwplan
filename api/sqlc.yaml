version: "2"
sql:
  - engine: postgresql
    schema: migrations/legacy_schema.sql
    queries: internal/repository/db/queries
    gen:
      go:
        package: sqlc
        out: internal/repository/db/sqlc
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
