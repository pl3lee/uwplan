components:
  schemas:
    AssignScheduleInputBody:
      additionalProperties: false
      properties:
        term:
          maxLength: 20
          minLength: 1
          type: string
      required:
        - term
      type: object
    AssignmentBody:
      additionalProperties: false
      properties:
        course:
          $ref: "#/components/schemas/CourseBody"
        term:
          type: string
      required:
        - course
        - term
      type: object
    CourseBody:
      additionalProperties: false
      properties:
        antireqs:
          type: string
        code:
          type: string
        coreqs:
          type: string
        description:
          type: string
        easy_rating:
          type:
            - string
            - "null"
        id:
          type: string
        liked_rating:
          type:
            - string
            - "null"
        name:
          type: string
        num_ratings:
          format: int32
          type:
            - integer
            - "null"
        prereqs:
          type: string
        useful_rating:
          type:
            - string
            - "null"
      required:
        - id
        - code
        - name
        - description
        - prereqs
        - antireqs
        - coreqs
        - useful_rating
        - liked_rating
        - easy_rating
        - num_ratings
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    LiveBody:
      additionalProperties: false
      properties:
        status:
          enum:
            - live
          type: string
      required:
        - status
      type: object
    ReadinessBody:
      additionalProperties: false
      properties:
        dependencies:
          $ref: "#/components/schemas/ReadinessBodyDependenciesStruct"
        release:
          $ref: "#/components/schemas/ReadinessBodyReleaseStruct"
        status:
          enum:
            - ready
            - unready
          type: string
      required:
        - status
        - release
        - dependencies
      type: object
    ReadinessBodyDependenciesStruct:
      additionalProperties: false
      properties:
        database:
          enum:
            - available
            - unavailable
          type: string
        redis:
          enum:
            - available
            - unavailable
          type: string
      required:
        - database
        - redis
      type: object
    ReadinessBodyReleaseStruct:
      additionalProperties: false
      properties:
        digest:
          type: string
        revision:
          type: string
      required:
        - digest
        - revision
      type: object
    ScheduleBody:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
      type: object
    ScheduleListResponseBody:
      additionalProperties: false
      properties:
        schedules:
          items:
            $ref: "#/components/schemas/ScheduleBody"
          type:
            - array
            - "null"
      required:
        - schedules
      type: object
    ScheduleNameBody:
      additionalProperties: false
      properties:
        name:
          maxLength: 255
          minLength: 1
          type: string
      required:
        - name
      type: object
    ScheduleViewResponseBody:
      additionalProperties: false
      properties:
        assigned:
          items:
            $ref: "#/components/schemas/AssignmentBody"
          type:
            - array
            - "null"
        schedule:
          $ref: "#/components/schemas/ScheduleBody"
        selected:
          items:
            $ref: "#/components/schemas/CourseBody"
          type:
            - array
            - "null"
        term_range:
          $ref: "#/components/schemas/TermRangeBody"
      required:
        - schedule
        - selected
        - assigned
        - term_range
      type: object
    TermRangeBody:
      additionalProperties: false
      properties:
        end_term:
          enum:
            - Winter
            - Spring
            - Fall
          type: string
        end_year:
          format: int64
          maximum: 9999
          minimum: 1
          type: integer
        start_term:
          enum:
            - Winter
            - Spring
            - Fall
          type: string
        start_year:
          format: int64
          maximum: 9999
          minimum: 1
          type: integer
      required:
        - start_term
        - start_year
        - end_term
        - end_year
      type: object
    UserBody:
      additionalProperties: false
      properties:
        email:
          type: string
        id:
          type: string
        image:
          type:
            - string
            - "null"
        name:
          type:
            - string
            - "null"
        role:
          enum:
            - user
            - moderator
            - admin
          type: string
      required:
        - id
        - email
        - name
        - image
        - role
      type: object
  securitySchemes:
    session:
      in: cookie
      name: __Host-uwplan_session
      type: apiKey
info:
  title: UWPlan API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/auth/callback/{provider}:
    get:
      description: Requires the matching browser state cookie. Invalid callbacks redirect to sign-in without creating a session.
      operationId: completeOAuth
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            enum:
              - google
              - github
            type: string
        - explode: false
          in: query
          name: code
          schema:
            maxLength: 4096
            type: string
        - explode: false
          in: query
          name: state
          schema:
            maxLength: 128
            type: string
        - explode: false
          in: query
          name: iss
          schema:
            maxLength: 256
            type: string
        - explode: false
          in: query
          name: error
          schema:
            maxLength: 256
            type: string
      responses:
        "302":
          description: Found
          headers:
            Domain:
              schema:
                type: string
            Expires:
              schema:
                type: string
            HttpOnly:
              schema:
                type: boolean
            Location:
              schema:
                type: string
            MaxAge:
              schema:
                format: int64
                type: integer
            Name:
              schema:
                type: string
            Partitioned:
              schema:
                type: boolean
            Path:
              schema:
                type: string
            Quoted:
              schema:
                type: boolean
            Raw:
              schema:
                type: string
            RawExpires:
              schema:
                type: string
            SameSite:
              schema:
                format: int64
                type: integer
            Secure:
              schema:
                type: boolean
            Set-Cookie:
              schema:
                type: string
            Unparsed:
              schema:
                type: string
            Value:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Complete provider sign-in
  /api/auth/signin/{provider}:
    get:
      operationId: startOAuth
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            enum:
              - google
              - github
            type: string
        - explode: false
          in: query
          name: return_to
          schema:
            maxLength: 2048
            type: string
      responses:
        "302":
          description: Found
          headers:
            Domain:
              schema:
                type: string
            Expires:
              schema:
                type: string
            HttpOnly:
              schema:
                type: boolean
            Location:
              schema:
                type: string
            MaxAge:
              schema:
                format: int64
                type: integer
            Name:
              schema:
                type: string
            Partitioned:
              schema:
                type: boolean
            Path:
              schema:
                type: string
            Quoted:
              schema:
                type: boolean
            Raw:
              schema:
                type: string
            RawExpires:
              schema:
                type: string
            SameSite:
              schema:
                format: int64
                type: integer
            Secure:
              schema:
                type: boolean
            Set-Cookie:
              schema:
                type: string
            Unparsed:
              schema:
                type: string
            Value:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Start provider sign-in
  /api/live:
    get:
      operationId: getLiveness
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Check API liveness
  /api/ready:
    get:
      operationId: getReadiness
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessBody"
          description: OK
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessBody"
          description: Dependencies unavailable
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Check database and session readiness
  /api/v1/auth/logout:
    post:
      description: Requires the configured public origin in the Origin header. Expired sessions can be logged out again.
      operationId: logout
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - session: []
        - {}
      summary: Revoke the current session
  /api/v1/me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - session: []
      summary: Get the signed-in user
  /api/v1/schedules:
    get:
      operationId: listSchedules
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleListResponseBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - session: []
      summary: List the user's schedules
    post:
      operationId: createSchedule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleNameBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleBody"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - session: []
      summary: Create a schedule
  /api/v1/schedules/{schedule_id}:
    delete:
      operationId: deleteSchedule
      parameters:
        - in: path
          name: schedule_id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - session: []
      summary: Delete a schedule while retaining at least one
    get:
      operationId: getSchedule
      parameters:
        - in: path
          name: schedule_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleViewResponseBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
