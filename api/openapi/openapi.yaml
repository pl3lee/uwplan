  /api/v1/schedules/{schedule_id}/courses/{course_id}:
    delete:
      operationId: removeScheduleCourse
      parameters:
        - in: path
          name: schedule_id
          required: true
          schema:
            type: string
        - in: path
          name: course_id
          required: true
