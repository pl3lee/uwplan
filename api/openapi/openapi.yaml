          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - session: []
      summary: Read an owned schedule with selections and assignments
    patch:
      operationId: renameSchedule
      parameters:
        - in: path
          name: schedule_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleNameBody"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
