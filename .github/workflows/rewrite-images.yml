name: Replacement Images

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  rewrite-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check release admission failure paths
        run: python3 -m unittest discover -s tests -p test_production_deploy.py
      - name: Build immutable-source API and web artifacts
        env:
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          docker build --build-arg RELEASE_REVISION="$RELEASE_REVISION" -f api/Dockerfile -t uwplan-api:ci .
          docker build --build-arg RELEASE_REVISION="$RELEASE_REVISION" -f web/Dockerfile -t uwplan-web:ci .
      - name: Verify the images with isolated PostgreSQL and Redis
        env:
          UWPLAN_API_IMAGE: uwplan-api:ci
          UWPLAN_WEB_IMAGE: uwplan-web:ci
        run: bash tests/rewrite-images.sh
      - name: Build the retained legacy artifact for recovery rehearsal
        env:
          RELEASE_REVISION: ${{ github.sha }}
        run: docker build --build-arg RELEASE_REVISION="$RELEASE_REVISION" -t uwplan-legacy:ci .
      - name: Rehearse migration, paired rollback, and usable backup restoration
        env:
          UWPLAN_LEGACY_IMAGE: uwplan-legacy:ci
          UWPLAN_API_IMAGE: uwplan-api:ci
          UWPLAN_WEB_IMAGE: uwplan-web:ci
        run: python3 tests/paired-production-stack.py
