name: PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Validate workflow contracts
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Check release admission failure paths
        run: python3 -m unittest discover -s tests -p test_production_deploy.py
