name: Release Image

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-production
  cancel-in-progress: false

jobs:
  api:
    uses: ./.github/workflows/api-check.yml

  web:
    uses: ./.github/workflows/web-check.yml

  images:
    uses: ./.github/workflows/rewrite-images.yml

  release:
    needs: [api, web, images]
    runs-on: ubuntu-latest
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive reproducible build timestamp
        id: source
        run: echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and publish the API
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          build-args: |
            RELEASE_REVISION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          cache-from: type=gha,scope=uwplan-api
          cache-to: type=gha,scope=uwplan-api,mode=max
          outputs: type=image,push=true,rewrite-timestamp=true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: docker.io/${{ github.repository }}-api:${{ github.sha }}

      - name: Build and publish the web application
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          build-args: |
            RELEASE_REVISION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          cache-from: type=gha,scope=uwplan-web
          cache-to: type=gha,scope=uwplan-web,mode=max
          outputs: type=image,push=true,rewrite-timestamp=true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: docker.io/${{ github.repository }}-web:${{ github.sha }}

      - name: Verify the published immutable artifacts
        env:
          UWPLAN_API_IMAGE: docker.io/${{ github.repository }}-api@${{ steps.api.outputs.digest }}
          UWPLAN_WEB_IMAGE: docker.io/${{ github.repository }}-web@${{ steps.web.outputs.digest }}
        run: |
          docker pull --platform linux/amd64 "$UWPLAN_API_IMAGE"
          docker pull --platform linux/amd64 "$UWPLAN_WEB_IMAGE"
          bash tests/rewrite-images.sh

      - name: Record the immutable paired manifest
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          IMAGE_NAME: docker.io/${{ github.repository }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          for DIGEST in "$API_DIGEST" "$WEB_DIGEST"; do
            if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Image build did not return a valid manifest digest" >&2
              exit 1
            fi
          done
          jq -n \
            --arg api_image "${IMAGE_NAME}-api" \
            --arg api_digest "$API_DIGEST" \
            --arg web_image "${IMAGE_NAME}-web" \
            --arg web_digest "$WEB_DIGEST" \
            --arg revision "$RELEASE_REVISION" \
            '{schemaVersion: 2, revision: $revision, api: {image: $api_image, digest: $api_digest, manifestReference: ($api_image + "@" + $api_digest)}, web: {image: $web_image, digest: $web_digest, manifestReference: ($web_image + "@" + $web_digest)}}' \
            > release-manifest.json
          {
            echo "### Immutable UWPlan release"
            echo '```json'
            cat release-manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: release
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Join the private deployment network with an ephemeral identity
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:uwplan-ci-deployer

      - name: Install the restricted deployment credential
        env:
          DEPLOY_KEY: ${{ secrets.UWPLAN_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.UWPLAN_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/uwplan-ssh"
          install -m 0600 /dev/null "$RUNNER_TEMP/uwplan-ssh/id_ed25519"
          install -m 0600 /dev/null "$RUNNER_TEMP/uwplan-ssh/known_hosts"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/uwplan-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/uwplan-ssh/known_hosts"

      - name: Validate access or admit the immutable release
        env:
          DEPLOY_API_DIGEST: ${{ needs.release.outputs.api_digest }}
          DEPLOY_WEB_DIGEST: ${{ needs.release.outputs.web_digest }}
          DEPLOY_HOST: ${{ vars.UWPLAN_DEPLOY_HOST }}
          DEPLOY_REVISION: ${{ github.sha }}
          DEPLOY_REF: ${{ github.ref }}
        run: |
          for DIGEST in "$DEPLOY_API_DIGEST" "$DEPLOY_WEB_DIGEST"; do
            if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Refusing to deploy an invalid manifest digest" >&2
              exit 1
            fi
          done
          COMMAND="deploy-pair $DEPLOY_API_DIGEST $DEPLOY_WEB_DIGEST $DEPLOY_REVISION"
          if [[ "$DEPLOY_REF" != "refs/heads/main" ]]; then COMMAND="status"; fi
          ssh \
            -i "$RUNNER_TEMP/uwplan-ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/uwplan-ssh/known_hosts" \
            "uwplan-deploy@$DEPLOY_HOST" \
            "$COMMAND"
