name: Release Image

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      manifest_digest: ${{ steps.image.outputs.digest }}
      manifest_reference: ${{ steps.record.outputs.manifest_reference }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: SKIP_ENV_VALIDATION=1 npm run check
      - run: SKIP_ENV_VALIDATION=1 npm test -- --runInBand

      - name: Derive reproducible build timestamp
        id: source
        run: echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish once
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            RELEASE_REVISION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,push=true,rewrite-timestamp=true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Record immutable manifest
        id: record
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Image build did not return a valid manifest digest" >&2
            exit 1
          fi
          MANIFEST_REFERENCE="${IMAGE_NAME}@${IMAGE_DIGEST}"
          jq -n \
            --arg image "$IMAGE_NAME" \
            --arg digest "$IMAGE_DIGEST" \
            --arg manifest_reference "$MANIFEST_REFERENCE" \
            --arg revision "$RELEASE_REVISION" \
            '{image: $image, digest: $digest, manifestReference: $manifest_reference, revision: $revision}' \
            > release-manifest.json
          echo "manifest_reference=$MANIFEST_REFERENCE" >> "$GITHUB_OUTPUT"
          echo "### Immutable UWPlan release" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "$MANIFEST_REFERENCE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: release
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Join the private deployment network with an ephemeral identity
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:uwplan-ci-deployer

      - name: Install the restricted deployment credential
        env:
          DEPLOY_KEY: ${{ secrets.UWPLAN_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.UWPLAN_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/uwplan-ssh"
          install -m 0600 /dev/null "$RUNNER_TEMP/uwplan-ssh/id_ed25519"
          install -m 0600 /dev/null "$RUNNER_TEMP/uwplan-ssh/known_hosts"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/uwplan-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/uwplan-ssh/known_hosts"

      - name: Admit the immutable release through the forced command
        env:
          DEPLOY_DIGEST: ${{ needs.release.outputs.manifest_digest }}
          DEPLOY_HOST: ${{ vars.UWPLAN_DEPLOY_HOST }}
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          if [[ ! "$DEPLOY_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Refusing to deploy an invalid manifest digest" >&2
            exit 1
          fi
          ssh \
            -i "$RUNNER_TEMP/uwplan-ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/uwplan-ssh/known_hosts" \
            "uwplan-deploy@$DEPLOY_HOST" \
            "deploy $DEPLOY_DIGEST $DEPLOY_REVISION"
