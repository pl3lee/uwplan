name: Web Check

on:
  pull_request:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  planning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Verify public and private flows on the production build
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-go-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright-go/
          retention-days: 7
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:web
      - name: Check generated client
        run: test -z "$(git status --porcelain -- web/app/generated)"
      - run: pnpm check:web
      - run: pnpm test:web
      - run: pnpm build:web
      - run: pnpm --filter @uwplan/web test:server
      - run: pnpm --filter @uwplan/web exec playwright install --with-deps chromium
      - run: pnpm --filter @uwplan/web test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright-web/
          retention-days: 7
