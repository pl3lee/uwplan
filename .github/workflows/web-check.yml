name: Web Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:web
      - name: Check generated client
        run: test -z "$(git status --porcelain -- web/app/generated)"
      - run: pnpm check:web
      - run: pnpm test:web
      - run: pnpm build:web
